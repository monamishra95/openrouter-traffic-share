name: gates

# The harness gates, applied to this project. Secrets are the live risk here —
# the build handles an API key, so G3 blocks first and always.

on: [push, pull_request, workflow_dispatch]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: monamishra95/multi-agent-harness@v0.3.0
        with:
          mode: 'release'
          scan-history: 'true'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # test_compute.py imports fetch_all.py to assert write() against every real
      # response shape, and fetch_all exits if requests is missing. The job passed
      # locally where requests was already installed and failed in CI, which is the
      # difference between "tests pass on my machine" and "tests pass".
      - name: Install dependencies
        run: pip install requests
      - name: Golden tests
        run: python tests/test_compute.py
