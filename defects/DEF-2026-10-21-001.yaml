id: DEF-2026-10-21-001
project: openrouter-traffic-share
class: F2            # stale: a factual claim true at authoring, false after upstream changed
severity: SEV1       # escaped (S4) -> SEV1 per PROTOCOL §1.3
stage_detected: S4
stage_should_have: S0-builder
owner_agent: scout   # F2 routes to research per PROTOCOL; Librarian to confirm
model: unknown       # introducing model not recorded in the commit history
description: >
  "What this cannot tell you" stated that customer support could not be
  measured because "no corresponding tag exists in OpenRouter's app categories
  or task classifications." OpenRouter's task feed now carries a
  `customer_support` classification (1.5% of requests in the 2026-10-20
  window), so the live page asserted the opposite of what its own data showed.
evidence: >
  data/tasks.json at df77ec8 contains tag customer_support / "Customer
  Support"; computed.json at the same commit still emitted the known-unknown.
  Found while verifying the page against openrouter.ai on 2026-10-21.
root_cause: >
  A claim about the state of an upstream feed was written as a constant in
  KNOWN_UNKNOWNS rather than derived from the feed, so nothing could notice
  when the feed changed. Same family as the hardcoded figures removed in
  33d4615: statements about current data must be computed from current data.
lesson_file:         # written by Librarian
regression_artifact: >
  tests/test_compute.py::test_customer_support_unknown_only_while_true and
  ::test_committed_known_unknowns_agree_with_the_task_feed; compute.py emits
  the entry via known_unknowns() only while no support tag exists.
promotion: memory    # Librarian to confirm; related to the hardcoded-figure class
recurrence_of: null
model_specific: false
status: open

# Postmortem (PROTOCOL §1.8, required for S4)
# 1. What happened? The page said a tag did not exist after upstream added it.
# 2. Earliest realistic catch point? S0 — when the known-unknown was written.
# 3. Why did that gate miss it? Known-unknowns were treated as prose, not as
#    claims about data, so no test compared them with the feeds.
# 4. What rule or gate changed? A known-unknown that depends on a feed is
#    computed from that feed.
# 5. What artifact now makes recurrence impossible? The two tests above.
