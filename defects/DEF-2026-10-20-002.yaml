id: DEF-2026-10-20-002
project: openrouter-traffic-share
class: C3            # integration: page reads a block compute.py never emits
severity: SEV1       # escaped (S4) -> SEV1 per PROTOCOL §1.3
stage_detected: S4
stage_should_have: S0-builder
owner_agent: builder
model: unknown       # introducing model not recorded in the commit history
description: >
  The Reconciliation panel read token_share.reconciliation.{listed_vendors,
  tail_vendors, sums_exactly}. compute.py never emitted that block, so the
  live page showed "Listed vendors 0", "Tail vendors 0" and "Reconciliation
  asserted in code ... FAILS" over data whose shares close exactly. The panel
  that exists to prove nothing is dropped reported a failure that wasn't real,
  and claimed an in-code assertion that didn't exist.
evidence: >
  computed.json at 41be462: token_share keys are window, totals, by_vendor,
  by_model, exclusion_rule — no `reconciliation`. index.html renders
  `r.sums_exactly ? 'holds' : 'FAILS'` with r = {}. Fixed in 74188e9.
root_cause: >
  Same seam as DEF-2026-09-21-001 and DEF-2026-10-20-001: the page was written
  against fields assumed to exist, and its fallback (`?? 0`, falsy -> FAILS)
  turned "not reported" into a confident wrong statement instead of an
  absence.
lesson_file:         # written by Librarian
regression_artifact: >
  tests/test_compute.py::test_90_day_reconciliation_is_emitted_for_the_page
  (producer emits the block; page still reads those names). Page fallback now
  renders an em dash and "not reported by this build of compute.py" when the
  block is absent.
promotion: hard-rule # recurrence -> promotion ladder; Librarian to confirm
recurrence_of: DEF-2026-09-21-001
model_specific: false
status: open

# Postmortem (PROTOCOL §1.8, required for S4)
# 1. What happened? The reconciliation panel printed FAILS on data that closes.
# 2. Earliest realistic catch point? S0 — when the panel was written.
# 3. Why did that gate miss it? No test compared what index.html reads with
#    what compute.py writes; the falsy fallback hid the absence.
# 4. What rule or gate changed? Absent fields render as absent ("—", "not
#    reported"), never as 0 or FAILS.
# 5. What artifact now makes recurrence impossible? The test above, for this
#    block. Third occurrence of this root cause: a single test that extracts
#    every DATA.* path index.html reads and asserts each is emitted by
#    build() would close the class, not the instance. Not yet written.
